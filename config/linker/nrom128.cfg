# ld65 config for Pac-Man: the whole iNES image, header, the one 16 KiB PRG
# bank and the 8 KiB CHR.
#
# BANK_FF covers $C000-$FFF9 and VECTORS the NMI/RESET/IRQ triple at
# $FFFA-$FFFF; ld65 errors out rather than silently padding if the source
# does not fit.

MEMORY {
    HDR:  file = %O, start = $0000, size = $0010, fill = yes;
    ROM0: file = %O, start = $C000, size = $3FFA, fill = yes, define = yes;
    ROMV: file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:  file = %O, start = $0000, size = $2000, fill = yes;
}

SEGMENTS {
    HEADER:  load = HDR, type = ro;
    BANK_FF: load = ROM0, type = ro;
    VECTORS: load = ROMV, type = ro;
    CHR:     load = CHR, type = ro;
}
