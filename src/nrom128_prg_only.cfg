# ld65 config for the reproduced Pac-Man PRG bank.
#
# Output is the bare 16 KiB PRG image, with no iNES header and no CHR --
# the build scripts prepend the original header and append the original CHR.
#
# The layout mirrors the ROM exactly, because the goal is a byte-identical
# rebuild: BANK_FF covers $C000..$FFF9 and VECTORS the NMI/RESET/IRQ triple
# at $FFFA..$FFFF. Together they are exactly $4000 bytes; ld65 errors out
# rather than silently padding if the disassembly does not fit.
#
# Segment names come from scripts/generate_repro_disasm.py.

MEMORY {
    ROM0: file = %O, start = $C000, size = $3FFA, fill = yes, define = yes;
    ROMV: file = %O, start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    BANK_FF: load = ROM0, type = ro;
    VECTORS: load = ROMV, type = ro;
}
