# ld65 config for the optional 32 KiB NROM-256 hack layout.
# The new HACK_BANK occupies $8000..$BFFF; Source Reconstruction 1.0 remains
# fixed at $C000..$FFFF with vectors at the same CPU addresses.

MEMORY {
    HACK: file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF, define = yes;
    ROM0: file = %O, start = $C000, size = $3FFA, fill = yes, define = yes;
    ROMV: file = %O, start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    HACK_BANK: load = HACK, type = ro;
    BANK_FF: load = ROM0, type = ro;
    VECTORS: load = ROMV, type = ro;
}
